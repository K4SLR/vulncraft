[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulncraft"
version = "1.0.0"
description = "Zero-Dependency Manual Bug Hunting Triage, ScopeGuard & PoC Report Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "k4slr"}
]
keywords = ["bug-bounty", "pentesting", "cybersecurity", "cvss", "poc-generator", "triage"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security"
]

[project.scripts]
vulncraft = "vulncraft.cli:main"
