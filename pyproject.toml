[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulncraft"
version = "1.1.0"
description = "Zero-dependency CLI toolkit for manual bug hunters, ScopeGuard validation, HTTP sanitization, and PoC reporting."
authors = [{ name = "k4slr" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vulncraft = "vulncraft.cli:main"

[tool.setuptools]
packages = ["vulncraft"]