name: VulnCraft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install VulnCraft package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run automated test suite
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -v

      - name: Run CLI sanity checks
        env:
          PYTHONPATH: .
        run: |
          python -m vulncraft --version
          python -m vulncraft cvss "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
          python -m vulncraft sanitize -r examples/raw_request.http
          python -m vulncraft triage -f examples/sample_findings.json -s examples/sample_scope.json
