name: VulnCraft CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v
      - name: Smoke Test CLI Triage, CVSS & Report Generation
        run: |
          python -m vulncraft triage -f examples/sample_findings.json -s examples/sample_scope.json --md output/report.md --html output/dashboard.html --json-out output/enriched.json
          python -m vulncraft cvss -v "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
